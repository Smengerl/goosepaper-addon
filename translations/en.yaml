configuration:
  remarkable_pairing_code:
    name: "reMarkable pairing code"
    description: >-
      One-time code that links this add-on to your reMarkable tablet, so it can upload
      generated newspapers. Get an 8-character code from https://my.remarkable.com/pair/app,
      paste it here, save, then restart the add-on. Only needed once - the pairing is stored
      under /data and survives restarts and updates - or again if you switch to a different
      reMarkable. The add-on refuses to start without a valid pairing; check the Log tab to see
      whether pairing succeeded. The field itself is masked but doesn't clear on its own once
      used - the code is single-use regardless, so it's safe to leave the old value here or
      clear it yourself.
  generation_log_level:
    name: "Generation log level"
    description: >-
      Minimum log level for everything involved in actually generating a newspaper - PDF/font
      rendering, HTTP requests, the scheduler library - shown under the Log tab. Defaults to
      "warning" to cut the noise: a single edition can otherwise produce dozens of low-level
      lines that bury this add-on's own messages (schedule triggers, the configured-newspapers
      overview, pairing status - all prefixed "Honk!"), which always show regardless of this
      setting. Set it to "debug" or "info" temporarily when you actually need to see what's
      happening inside generation, e.g. while debugging a broken RSS feed.
  locale:
    name: "Locale"
    description: >-
      Bare glibc locale identifier (e.g. "de_DE", "fr_FR", "es_ES" - no ".UTF-8" suffix) used to
      render written-out month/weekday names (the strftime "%B"/"%A" directives) in a paper's
      "datetime_format" (see a *.goosepaper.json's "paper" section) in that language instead of
      English. Generated on demand at add-on startup - restart the add-on after changing this.
      Leave empty (the default) to keep the container's default English names; every add-on
      installer's own newspapers may want a different language, so nothing is forced by default.
      An invalid identifier is logged as a warning under the Log tab and falls back to English
      rather than blocking startup.
