[project]
name = "goosepaper-addon"
version = "0.1.0"
description = "Generates and delivers personalized reMarkable newspapers from RSS feeds, built on goosepaper-logicpuzzles"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "goosepaper",
    "pydantic>=2.13.4",
]

[tool.uv.sources]
goosepaper = { git = "https://github.com/Smengerl/goosepaper-logicpuzzles", branch = "mainline" }

[dependency-groups]
dev = [
    "pymupdf>=1.28.0",
]
