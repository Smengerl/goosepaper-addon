configuration:
  remarkable_pairing_code:
    name: "reMarkable Pairing-Code"
    description: >-
      Einmaliger Code, der dieses Add-on mit deinem reMarkable-Tablet verknüpft, damit es
      erzeugte Zeitungen hochladen kann. Hole dir einen 8-stelligen Code unter
      https://my.remarkable.com/pair/app, trage ihn hier ein, speichere und starte das Add-on
      danach neu. Nur einmalig nötig - das Pairing wird unter /data gespeichert und übersteht
      Neustarts und Updates - oder erneut, wenn du auf ein anderes reMarkable wechselst. Ohne
      gültiges Pairing startet das Add-on nicht; im Reiter "Protokoll" siehst du, ob das Pairing
      erfolgreich war. Das Feld selbst ist maskiert, leert sich aber nach Verwendung nicht von
      selbst - der Code ist ohnehin nur einmal gültig, du kannst den alten Wert also stehen
      lassen oder ihn selbst löschen.
  generation_log_level:
    name: "Log-Level der Generierung"
    description: >-
      Minimales Log-Level für alles, was mit der eigentlichen Zeitungserzeugung zu tun hat - PDF-
      /Font-Rendering, HTTP-Requests, die Scheduler-Bibliothek - im Reiter "Protokoll". Standard
      ist "warning", um das Rauschen zu reduzieren: eine einzelne Ausgabe kann sonst Dutzende
      Zeilen auf niedrigem Level erzeugen, die die eigenen Meldungen dieses Add-ons (Auslösen
      eines Zeitplans, die Übersicht der konfigurierten Zeitungen, Pairing-Status - alle mit
      "Honk!" markiert) darunter begraben; diese werden unabhängig von dieser Einstellung immer
      angezeigt. Setze es vorübergehend auf "debug" oder "info", wenn du tatsächlich sehen musst,
      was während der Generierung passiert, z.B. beim Debuggen eines kaputten RSS-Feeds.
  locale:
    name: "Sprache (Locale)"
    description: >-
      Reine glibc-Locale-Kennung (z.B. "de_DE", "fr_FR", "es_ES" - ohne ".UTF-8"-Endung) für
      ausgeschriebene Monats-/Wochentagsnamen (die strftime-Platzhalter "%B"/"%A") in einem
      "datetime_format" einer Zeitung (siehe den "paper"-Abschnitt einer *.goosepaper.json) - in
      dieser Sprache statt auf Englisch. Wird beim Start des Add-ons bei Bedarf erzeugt - danach
      das Add-on neu starten. Leer lassen (Standard) für die englischen Namen des Containers;
      nicht jeder, der dieses Add-on installiert, möchte seine Zeitungen in derselben Sprache,
      daher wird standardmäßig nichts erzwungen. Eine ungültige Kennung erscheint als Warnung im
      Reiter "Protokoll" und fällt auf Englisch zurück, statt den Start zu blockieren.
