name: Goosepaper
version: "1.5.0"
slug: goosepaper
description: Personalized newspaper PDFs from RSS feeds, Wikipedia, weather, puzzles, and comics, delivered to a reMarkable tablet.
url: https://github.com/Smengerl/goosepaper-addon
arch:
  - aarch64
startup: application
boot: auto
init: false
map:
  - app_config:rw
options:
  remarkable_pairing_code: ""
  generation_log_level: "warning"
schema:
  remarkable_pairing_code: "password?"
  generation_log_level: "list(debug|info|warning|error|critical)?"
